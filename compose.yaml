services:
  sentinel:
    build:
      context: "."
      dockerfile: "Containerfile"
    image: "sentinel:${VERSION}"
    container_name: "sentinel"
    restart: "unless-stopped"
    networks:
      - "sentinel"
    env_file:
      - ".env"
    volumes:
      - "/var/data/sentinel:/data"
    entrypoint: [ "/app/sentinel" ]

networks:
  sentinel:
    external: true
